# What is licensed in this repository, and by whom, file by file (REUSE 3.3,
# https://reuse.software/spec-3.3/).
#
# The R package is the code: R/, tests/, man/, DESCRIPTION and NAMESPACE.
# `License: MIT + file LICENSE` in DESCRIPTION covers that and nothing else,
# because .Rbuildignore keeps ui/www/ and writing/ out of the built package.
# The package's notices are in LICENSE and LICENSE.md at the root.
#
# The thesis is not the package. The chapters under ui/www/chapters/,
# ui/www/index.qmd, ui/www/references.bib and the other pages and settings
# the author writes under ui/www/ have no entry here and no notice of their
# own: they are the author's work, and nothing in this repository gives
# anybody a right to reuse them. No pattern below reaches into those places.
#
# The two shipped files under writing/ are dataimago's. writing/README.md is
# listed below. writing/STYLE.md carries its MIT notice inside the file,
# which licenses the whole file: a style guide of the author's own replaces
# it and leaves the notice out. Anything else the author puts under
# writing/ has no entry.
#
# The files that came from dataimago keep their own licences and are named
# one by one: the template's tooling (MIT), the thesis class (LPPL 1.3c or
# later) and the Noto fonts (SIL Open Font License 1.1, the Noto Project
# Authors). The texts are in LICENSES/.
#
# An entry stays true only while the file is still the template's. If you
# replace a listed file with your own, delete its line.
#
# `precedence` is left at its default (`closest`): a copyright and licence
# header inside a file replaces the entry for that file here, for the whole
# file.

version = 1

# The package files that came from the template, named one by one: the
# author's, with dataimago's notice for the template's parts. Code the
# author adds has no entry here: DESCRIPTION and LICENSE, which name the
# author, are what license it. man/.gitkeep is empty and needs no entry.
[[annotations]]
path = [
  "DESCRIPTION",
  "NAMESPACE",
  "NEWS.md",
  "R/dissertation-package.R",
  "tests/testthat.R",
  "tests/testthat/test-template.R",
]
SPDX-FileCopyrightText = [
  "The package's author, named in LICENSE",
  "2026 dataimago, for the parts that came from dissertation-rpkg-template",
]
SPDX-License-Identifier = "MIT"

