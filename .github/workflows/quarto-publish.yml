name: Publish Quarto Site

# Publishes the ui/www Quarto book (HTML, web profile) + the committed
# thesis PDF to GitHub Pages via the artifact flow -- nothing is committed,
# so this never races build-thesis.yml's commit-back loop. The workflow_run
# trigger republishes the site after each PDF rebuild (the bot's skip-ci
# commit suppresses push events but not workflow_run).
#
# A GitHub Pages site is on the public web even when its repository is private
# (a paid plan allows that; on the free plan a private repository cannot have
# Pages at all, so the deploy would fail). So a private repository publishes
# nothing, and the site is not even built, unless the author opts in with the
# repository variable PUBLISH_PAGES_FROM_PRIVATE set to `true` (Settings ->
# Secrets and variables -> Actions -> Variables). See README.md, "The website".

on:
  push:
    branches: [main]
    paths:
      - 'ui/www/**'
      - 'R/**'
      - 'man/**'
      - 'DESCRIPTION'
      - '.github/workflows/quarto-publish.yml'
  workflow_run:
    workflows: ["Build thesis PDF"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # A provisioned repo's FIRST commit is the raw template copy: DESCRIPTION
  # still holds `{{...}}` placeholders until the hub's substitution commit
  # lands seconds later. Running on that commit fails ("Malformed package
  # name") and its PDF commit races the real one, leaving red marks on a
  # brand-new repo. Skip it; the substitution commit runs everything.
  guard:
    if: github.repository != 'dataimago/dissertation-rpkg-template'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      publish: ${{ steps.visibility.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: DESCRIPTION
          sparse-checkout-cone-mode: false
      - id: check
        run: |
          if grep -q '{{' DESCRIPTION; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Template placeholders not filled in yet (provisioning in progress); skipping this run."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # Publish only from a public repository, or from a private one whose
      # author opted in. The event payload's `repository.private` says which;
      # only the exact value `false` counts as public, so an unreadable or
      # missing value publishes nothing.
      - id: visibility
        if: steps.check.outputs.ready == 'true'
        env:
          OPT_IN: ${{ vars.PUBLISH_PAGES_FROM_PRIVATE }}
        run: |
          private=$(jq -r '.repository.private' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          if [ "$private" = "false" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$OPT_IN" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This repository is not public, and the repository variable PUBLISH_PAGES_FROM_PRIVATE is true: publishing the thesis site to the public web."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing was published: this repository is private (or its visibility could not be read), and a GitHub Pages site is public. To publish the thesis site, make the repository public, or (on a paid GitHub plan) set the repository variable PUBLISH_PAGES_FROM_PRIVATE to true. See README.md, \"The website\"."
          fi

  build-site:
    needs: guard
    # Never run in the template repo itself, nor in a private repository that
    # has not opted in (guard's `publish` output): nothing would be deployed.
    if: >-
      needs.guard.outputs.ready == 'true' &&
      needs.guard.outputs.publish == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # The package-reference page renders man/*.Rd straight from the
      # source tree (tools::Rd_db(dir=)) -- no package installation and no
      # Suggests needed; knitr/rmarkdown power the executable chunk and xml2
      # restructures the Rd2HTML fragments (headings, argument lists).
      - name: Install chunk dependencies
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown", "xml2"))'

      - name: Render site (web profile)
        run: |
          cd ui/www
          quarto render --to html --profile web

      - name: Restore committed thesis PDF into the site
        # The very first publish can run before build-thesis has committed a
        # PDF; publish the site without it rather than fail (it re-runs when
        # the PDF lands, via workflow_run).
        run: |
          if git cat-file -e HEAD:docs/thesis.pdf 2>/dev/null; then
            git checkout -- docs/thesis.pdf
          else
            echo "::notice::No committed thesis PDF yet; publishing the site without it."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: [guard, build-site]
    # The visibility gate again, on the job that publishes, so a later change
    # to build-site's condition cannot open it.
    if: >-
      github.repository != 'dataimago/dissertation-rpkg-template' &&
      needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
