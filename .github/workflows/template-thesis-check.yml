name: Template thesis check

# TEMPLATE-ONLY. The dissertation-ai hub copies every file of this repo into an
# author's repository, so every job here is guarded with
# `github.repository == 'dataimago/dissertation-rpkg-template'` and never runs
# in an author's repo (the reverse of the `!=` guard that build-thesis.yml uses
# to skip the template, whose ui/www still holds {{placeholders}}).
#
# Two checks that build-thesis.yml cannot make here:
#   vendored  the house class files in ui/www/thesis-class/ and the profiles in
#             ui/www/profiles/ are byte-identical to the registry
#             (dataimago/dissertation-thesis-classes) at the commit recorded in
#             ui/www/thesis-class/registry-source.json, so nobody hand-edits them.
#   sample    the template's sample thesis, with sample values in place of the
#             {{placeholders}}, renders to a tagged PDF with the fonts the
#             profile names. The hub fills the real values in; this proves the
#             starting point builds.

on:
  pull_request:
    paths:
      - 'ui/www/**'
      - '.github/workflows/template-thesis-check.yml'
      - '.github/workflows/build-thesis.yml'
  push:
    branches: [main]
    paths:
      - 'ui/www/**'
      - '.github/workflows/template-thesis-check.yml'
      - '.github/workflows/build-thesis.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  vendored:
    name: Vendored class matches the registry
    if: github.repository == 'dataimago/dissertation-rpkg-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 ui/www/thesis-class/sync.py check
      # The TeX Live pin in both workflows equals tools/texlive-pin.txt in the registry at the
      # commit the vendored class came from: the registry's CI built that class on that snapshot.
      - name: The TeX Live pin matches the registry
        run: |
          set -eu
          C=$(python3 -c 'import json; print(json.load(open("ui/www/thesis-class/registry-source.json"))["commit"])')
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/dataimago/dissertation-thesis-classes/$C/tools/texlive-pin.txt" | grep '^TL_' | sort > "$RUNNER_TEMP/registry-pin.txt"
          test -s "$RUNNER_TEMP/registry-pin.txt"
          for f in build-thesis.yml template-thesis-check.yml; do
            sed -nE 's/^ *(TL_SNAPSHOT|TL_INSTALLER_SHA512|TL_TLPDB_SHA512): *([^ ]+) *$/\1=\2/p' ".github/workflows/$f" | sort > "$RUNNER_TEMP/pin-$f.txt"
            diff "$RUNNER_TEMP/registry-pin.txt" "$RUNNER_TEMP/pin-$f.txt" || { echo "::error::the TeX Live pin in $f differs from tools/texlive-pin.txt at registry commit $C (< registry, > workflow)"; exit 1; }
          done

  sample:
    name: Sample thesis builds
    if: github.repository == 'dataimago/dissertation-rpkg-template'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The TeX Live install is copied into build-thesis.yml (the authors' build, which
      # cannot run in this repo). Fail if the tlmgr package lists diverge.
      - name: The package lists match build-thesis.yml
        run: |
          grep '^ *"[$]BIN/tlmgr" install' .github/workflows/build-thesis.yml > /tmp/a.txt
          grep '^ *"[$]BIN/tlmgr" install' .github/workflows/template-thesis-check.yml > /tmp/b.txt
          test -s /tmp/a.txt && diff /tmp/a.txt /tmp/b.txt

      - name: Fill the placeholders with sample values
        run: |
          set -eu
          rm -rf "$RUNNER_TEMP/sample" && mkdir -p "$RUNNER_TEMP/sample/ui"
          cp -R ui/www "$RUNNER_TEMP/sample/ui/www"
          cd "$RUNNER_TEMP/sample/ui/www"
          grep -rlF '{{' --include='*.qmd' --include='*.yml' --include='*.bib' --exclude-dir=assets . | while read -r f; do
            sed -i \
              -e 's/{{thesis\.workingTitle}}/A Synthetic Study of Imaginary Systems/g' \
              -e 's/{{thesis\.workingSubtitle}}/A Template Build/g' \
              -e 's/{{user\.name}}/Ada Q. Example/g' \
              -e 's/{{institution\.name}}/Example University/g' \
              -e 's/{{institution\.degreeProgram}}/Ph.D. in Applied Studies/g' "$f"
          done
          if grep -rnF '{{' --include='*.qmd' --include='*.yml' --include='*.bib' --exclude-dir=assets .; then
            echo "::error::a {{placeholder}} the hub knows about is missing from the sample values above"; exit 1
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # The chapters carry an executable R chunk, so Quarto runs knitr.
      - run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9 # keep equal to build-thesis.yml

      # Same TeX Live as build-thesis.yml (see the comments there).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends perl fontconfig poppler-utils
      - name: Cache TeX Live
        id: tl-cache
        uses: actions/cache@v4
        with:
          path: ~/texlive
          key: texlive-2026-${{ runner.os }}-${{ hashFiles('ui/www/thesis-class/registry-source.json', '.github/workflows/build-thesis.yml', '.github/workflows/template-thesis-check.yml') }}
      - name: Install TeX Live
        if: steps.tl-cache.outputs.cache-hit != 'true'
        env:
          # The pinned TeX Live: the same three values as tools/texlive-pin.txt in
          # dataimago/dissertation-thesis-classes, whose CI builds the house class on this
          # snapshot. A bump changes all three there first (its CONTRIBUTING.md, "Maintainers:
          # bumping TeX Live") and then here; it changes this file, so the cache rebuilds.
          TL_SNAPSHOT: 2026/11/09
          TL_INSTALLER_SHA512: 9bf5cc108530b16f8bb3af646b429f2ace8ad640326fc4b5d95e9e056126427a52e90ad923316f7f9e7b5e232eb1fd0af0c79e6f4c00a9f2437c4a22ecd6b06f
          TL_TLPDB_SHA512: f7c90c78376245b0bed91ff10a6d19d7e3c48099f61349e2419d492b0ce8357519734a38d5a27d1af937a3c6c6fe8f751ae5c5a2463b66cf60f57d14e5a981d4
        run: |
          TL="$HOME/texlive"
          mkdir -p /tmp/tlinst && cd /tmp/tlinst
          REPO="https://texlive.info/tlnet-archive/$TL_SNAPSHOT/tlnet"
          # Download to a file and check it (a retried download piped into tar could leave tar a
          # truncated stream), then check that the snapshot's package database is the pinned one;
          # install-tl and tlmgr check every package against that database.
          curl -fsSL --retry 4 --retry-delay 5 --retry-all-errors -o install-tl-unx.tar.gz "$REPO/install-tl-unx.tar.gz"
          echo "$TL_INSTALLER_SHA512  install-tl-unx.tar.gz" | sha512sum -c --quiet -
          curl -fsSL --retry 4 --retry-delay 5 --retry-all-errors -o texlive.tlpdb.sha512 "$REPO/tlpkg/texlive.tlpdb.sha512"
          [ "$(cut -d' ' -f1 texlive.tlpdb.sha512)" = "$TL_TLPDB_SHA512" ] || { echo "::error::the package database at $REPO is not the pinned one (TL_TLPDB_SHA512)" >&2; exit 1; }
          tar xzf install-tl-unx.tar.gz --strip-components=1
          cat > profile.txt <<EOP
          selected_scheme scheme-medium
          TEXDIR $TL
          TEXMFLOCAL $TL/texmf-local
          TEXMFSYSCONFIG $TL/texmf-config
          TEXMFSYSVAR $TL/texmf-var
          TEXMFHOME $TL/texmf-home
          instopt_adjustpath 0
          instopt_adjustrepo 0
          tlpdbopt_autobackup 0
          tlpdbopt_install_docfiles 0
          tlpdbopt_install_srcfiles 0
          EOP
          perl ./install-tl --profile profile.txt --no-interaction --repository "$REPO"
          BIN=$(ls -d "$TL"/bin/*)
          # tlmgr installs from the same snapshot, never from the current CTAN mirror
          "$BIN/tlmgr" option repository "$REPO"
          "$BIN/tlmgr" install tex-gyre tex-gyre-math luamml tagpdf latex-lab latexmk selnolig xurl bookmark pdflscape caption unicode-math fontspec setspace
          # What Pandoc's LaTeX template needs beyond scheme-medium (code blocks, tables,
          # callouts), found by rendering the starter book. A package your own content
          # needs is added to this line.
          "$BIN/tlmgr" install framed footnotehyper booktabs fancyvrb float xcolor colorprofiles tcolorbox fontawesome5 pgf
          "$BIN/tlmgr" --version
      - name: Put TeX Live on PATH and register its fonts with fontconfig
        run: |
          BIN=$(ls -d "$HOME"/texlive/bin/*)
          echo "$BIN" >> "$GITHUB_PATH"
          # fontconfig serves only the XeLaTeX fallback (LuaLaTeX loads TeX Gyre from the
          # TeX tree); the PDF's fonts are checked after render, so this part only warns.
          CONF="$HOME/texlive/texmf-var/fonts/conf/texlive-fontconfig.conf"
          if [ -f "$CONF" ]; then
            mkdir -p "$HOME/.config/fontconfig/conf.d"
            cp "$CONF" "$HOME/.config/fontconfig/conf.d/09-texlive.conf"
            fc-cache -f || echo "::warning::fc-cache failed; an XeLaTeX fallback build may not find TeX Gyre."
          else
            echo "::warning::$CONF not found; fontconfig will not see TeX Gyre (only the XeLaTeX fallback needs it)."
          fi
          fc-list | grep -m3 -i -E "TeX ?Gyre ?Termes" || echo "::warning::fontconfig does not list TeX Gyre Termes; an XeLaTeX fallback build may not find it."

      - name: Render the sample thesis
        working-directory: ${{ runner.temp }}/sample/ui/www
        run: quarto render --to pdf

      - name: Check the PDF
        run: |
          PDF="$RUNNER_TEMP/sample/docs/thesis.pdf"
          test -s "$PDF"
          pdfinfo "$PDF" | tee /tmp/pdfinfo.txt
          grep -q '^Tagged: *yes' /tmp/pdfinfo.txt || { echo "::error::the sample PDF is not tagged"; exit 1; }
          pdffonts "$PDF"
          sh ui/www/thesis-class/check-pdf-fonts.sh "$RUNNER_TEMP/sample/ui/www" "$PDF"

      - name: Keep the PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-thesis-pdf
          path: ${{ runner.temp }}/sample/docs/thesis.pdf
          if-no-files-found: ignore
          retention-days: 7
